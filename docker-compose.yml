services:
  # Сайт (API + фронтенд) с GPU (нужен NVIDIA Container Toolkit): docker compose up --build web
  web:
    image: photonika:cuda
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
      args:
        PYTHON_BASE: pytorch/pytorch:2.5.1-cuda12.1-cudnn9-runtime
        TORCH_PREINSTALLED: "1"
    ports:
      - "8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ./data/weights:/app/data/weights:ro
      - ./results:/app/results

  # Сайт без GPU: docker compose --profile cpu up --build web-cpu   (http://localhost:8000)
  web-cpu:
    image: photonika:cpu
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
      args:
        TORCH_INDEX: https://download.pytorch.org/whl/cpu
    ports:
      - "8000:8000"
    environment:
      - PHOTONIKA_DEVICE=cpu
    volumes:
      - ./data/weights:/app/data/weights:ro
      - ./results:/app/results
    profiles: ["cpu"]

  # Streamlit-демо (запасной интерфейс): docker compose --profile streamlit up --build streamlit
  streamlit:
    image: photonika:streamlit
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: streamlit
      args:
        TORCH_INDEX: https://download.pytorch.org/whl/cpu
    ports:
      - "8501:8501"
    command: ["streamlit", "run", "ml/streamlit_app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    volumes:
      - ./data/weights:/app/data/weights:ro
    profiles: ["streamlit"]

  # Формат сдачи в контейнере:
  #   docker compose --profile cpu run --rm synth --inputs data/testsets/photos_classic/1.png \
  #     data/testsets/photos_classic/2.png data/testsets/photos_classic/3.png data/testsets/photos_classic/4.png --out results/demo
  synth:
    image: photonika:cpu
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
      args:
        TORCH_INDEX: https://download.pytorch.org/whl/cpu
    entrypoint: ["python", "-m", "ml.cli", "synth"]
    volumes:
      - ./data/weights:/app/data/weights:ro
      - ./results:/app/results
    profiles: ["cpu"]
